# Configuration Nginx pour React Router - Gestion du routing côté client
# Placez ce fichier dans votre configuration Nginx ou copiez le contenu dans votre site

server {
    listen 80;
    server_name your-domain.com; # Remplacez par votre domaine
    root /path/to/your/dist; # Remplacez par le chemin vers votre dossier dist
    
    # Index file
    index index.html;
    
    # Handle client-side routing - Toutes les requêtes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;
    
    # Prevent access to hidden files
    location ~ /\. {
        deny all;
    }
}

